[tool.poetry]
name = "xcrap"
version = "0.1.0"
description = "A modern, declarative, and modular web scraping framework for Python."
authors = ["Marcuth <contact@marcuth.dev>"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/xcrap-dev/xcrap-python"
homepage = "https://github.com/xcrap-dev/xcrap-python"
documentation = "https://github.com/xcrap-dev/xcrap-python/tree/master/docs"
keywords = ["scraping", "crawler", "spider", "framework", "asyncio", "pydantic", "parsel", "html", "json", "markdown"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
]


[tool.poetry.dependencies]
python = "^3.12"
parsel = "^1.11.0"
jmespath = "^1.1.0"
httpx = "^0.28.1"
pydantic = "^2.12.5"
cryptography = "^42.0.0"
markdown = "^3.11.2"
curl-cffi = { version = ">=0.7.0", optional = true }
playwright = { version = ">=1.40.0", optional = true }
selenium = { version = ">=4.20.0", optional = true }
seleniumbase = { version = ">=4.30.0", optional = true }
pytesseract = { version = ">=0.3.10", optional = true }
pillow = { version = ">=10.0.0", optional = true }

[tool.poetry.extras]
curl = ["curl-cffi"]
playwright = ["playwright"]
selenium = ["selenium"]
seleniumbase = ["seleniumbase"]
ocr = ["pytesseract", "pillow"]
all = ["curl-cffi", "playwright", "selenium", "seleniumbase", "pytesseract", "pillow"]



[tool.poetry.group.dev.dependencies]
ruff = "^0.15.2"
pytest = "^9.0.2"
pytest-cov = "^7.0.0"
pytest-asyncio = "^1.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 134
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["xcrap"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder"
]
combine-as-imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"